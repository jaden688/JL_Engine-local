name: Windows installer release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"

      - name: Set up bundled Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Stage application-local Julia and Python runtimes
        shell: pwsh
        run: |
          $julia = (Get-Command julia).Source
          $juliaRoot = Split-Path (Split-Path $julia -Parent) -Parent
          if (!(Test-Path $juliaRoot)) { throw "Could not locate Julia runtime from $julia" }
          New-Item -ItemType Directory -Force packaging/windows/runtime | Out-Null
          Copy-Item "$juliaRoot\*" packaging/windows/runtime -Recurse -Force
          if (!(Test-Path "packaging/windows/runtime/bin/julia.exe")) {
            throw "Julia runtime staging failed: bin/julia.exe is missing"
          }

          $pythonRoot = $env:pythonLocation
          if (!$pythonRoot -or !(Test-Path "$pythonRoot\python.exe")) {
            throw "Could not locate Python runtime from setup-python"
          }
          New-Item -ItemType Directory -Force packaging/windows/python | Out-Null
          Copy-Item "$pythonRoot\*" packaging/windows/python -Recurse -Force
          if (!(Test-Path "packaging/windows/python/python.exe")) {
            throw "Python runtime staging failed: python.exe is missing"
          }

      - name: Instantiate and smoke-test engine in the app-local depot
        shell: pwsh
        run: |
          $env:JULIA_DEPOT_PATH = Join-Path $PWD "packaging/windows/depot"
          $env:JULIA_CONDAPKG_BACKEND = "Null"
          $env:JULIA_PYTHONCALL_EXE = Join-Path $PWD "packaging/windows/python/python.exe"
          New-Item -ItemType Directory -Force $env:JULIA_DEPOT_PATH | Out-Null
          julia --project=. -e 'using Pkg; Pkg.instantiate(); using JLEngine; println("JLEngine import smoke test passed")'
          if ($LASTEXITCODE -ne 0) { throw "Julia dependency instantiation or engine import failed" }

      - name: Verify staging is application-local, not a virtual environment
        shell: pwsh
        run: |
          foreach ($path in @(".venv", "venv", ".conda")) {
            if (Test-Path $path) { throw "Unexpected virtual-environment directory in repository root: $path" }
          }
          if (!(Test-Path "packaging/windows/depot/packages")) {
            throw "Julia package dependencies were not staged in the installer depot"
          }
          if (!(Test-Path "packaging/windows/python/python.exe")) {
            throw "Bundled Python executable is missing"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows/JL-Engine.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (!(Test-Path "dist/JL-Engine-Setup.exe")) { throw "Installer output was not created" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: JL-Engine-Windows-Installer
          path: dist/JL-Engine-Setup.exe
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/JL-Engine-Setup.exe
          generate_release_notes: true

name: Windows installer release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"

      - name: Stage Julia runtime
        shell: pwsh
        run: |
          $julia = (Get-Command julia).Source
          $runtime = Split-Path (Split-Path $julia -Parent) -Parent
          if (!(Test-Path $runtime)) { throw "Could not locate Julia runtime from $julia" }
          New-Item -ItemType Directory -Force packaging/windows/runtime | Out-Null
          Copy-Item "$runtime\*" packaging/windows/runtime -Recurse -Force
          if (!(Test-Path "packaging/windows/runtime/bin/julia.exe")) {
            throw "Julia runtime staging failed: bin/julia.exe is missing"
          }

      - name: Instantiate and smoke-test engine without a virtual environment
        shell: pwsh
        run: |
          $env:JULIA_DEPOT_PATH = Join-Path $PWD "packaging/windows/depot"
          $env:JULIA_CONDAPKG_BACKEND = "Null"
          $env:JULIA_PYTHONCALL_EXE = "python"
          New-Item -ItemType Directory -Force $env:JULIA_DEPOT_PATH | Out-Null
          julia --project=. -e 'using Pkg; Pkg.instantiate(); using JLEngine; println("JLEngine import smoke test passed")'
          if ($LASTEXITCODE -ne 0) { throw "Julia dependency instantiation or engine import failed" }

      - name: Verify installer staging has no Python virtual environment
        shell: pwsh
        run: |
          $forbidden = @(".venv", "venv", ".conda")
          foreach ($path in $forbidden) {
            if (Test-Path $path) { throw "Unexpected virtual-environment directory found in repository root: $path" }
          }
          if (!(Test-Path "packaging/windows/depot/packages")) {
            throw "Julia package dependencies were not staged in the installer depot"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows/JL-Engine.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (!(Test-Path "dist/JL-Engine-Setup.exe")) { throw "Installer output was not created" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: JL-Engine-Windows-Installer
          path: dist/JL-Engine-Setup.exe
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/JL-Engine-Setup.exe
          generate_release_notes: true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "j_engine"
version = "1.0.0"
description = "Headless J_engine core package with a menu-driven CLI and optional FastAPI API."
readme = "README.md"
license = {file = "LICENSE.md"}
requires-python = ">=3.10"
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pydantic>=1.10",
  "python-dotenv",
  "requests",
  "pyyaml",
  "httpx",
  "jsonschema",
]

[project.optional-dependencies]
api = [
  "fastapi",
  "uvicorn[standard]",
]
browser = [
  "playwright>=1.40",
]
ui = [
  "PySide6",
]
full = [
  "fastapi",
  "uvicorn[standard]",
  "playwright>=1.40",
  "PySide6",
]

[project.scripts]
j-engine = "jl_engine_cli.main:main"
j-agent = "jl_engine_core.agent_cli:main"
jl-engine = "jl_engine_cli.main:main"
jl-agent = "jl_engine_core.agent_cli:main"
cli = "jl_engine_cli.lsp_cli:main"

[tool.setuptools]
package-dir = {"" = "."}
license-files = ["LICENSE.md", "NOTICE"]

[tool.setuptools.packages.find]
where = [".", "src"]
include = [
  "jl_engine_core",
  "jl_engine",
  "jl_engine.*",
  "jl_engine_cli",
  "framework",
  "framework.*",
  "tools",
  "tools.*",
  "jl_platform",
  "jl_platform.*",
  "modules",
  "modules.*",
  "config",
]

[tool.setuptools.package-data]
jl_engine_core = [
  "data/**/*.json",
  "data/*.json",
  "gemini_config.json",
]
config = [
  "agent_schema.json",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
